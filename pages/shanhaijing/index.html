<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f1e7">
  <link rel="icon" href="data:,">
  <title>山海经 · 数字读本</title>
  <style>:root {
  color-scheme: light;
  --paper: #f5f1e7;
  --surface: #fbf9f3;
  --surface-raised: #fffdf8;
  --ink: #282920;
  --muted: #68685e;
  --border: #d9d2c2;
  --accent: #9c3d2c;
  --moss: #46665b;
  --focus: #b14d37;
  --font-body: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  --font-ui: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  --space-1: .35rem;
  --space-2: .65rem;
  --space-3: 1rem;
  --space-4: 1.5rem;
  --space-5: 2.25rem;
  --content-width: 1200px;
  --reading-width: 72ch;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 1rem; }
body { min-height: 100vh; margin: 0; line-height: 1.75; background: var(--paper); color: var(--ink); }
button, a { font: inherit; }
a { color: var(--moss); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.skip-link { position: fixed; z-index: 5; inset: -5rem auto auto 1rem; padding: .5rem 1rem; color: var(--ink); background: var(--surface-raised); }
.skip-link:focus { inset-block-start: 1rem; }
.site-header { display: flex; min-height: 4.2rem; align-items: center; justify-content: space-between; gap: var(--space-4); padding: .65rem max(4vw, 1rem); border-bottom: 1px solid var(--border); background: var(--surface); }
.wordmark { color: var(--ink); font-size: 1.1rem; letter-spacing: .12em; text-decoration: none; white-space: nowrap; }
.wordmark span { margin-inline-start: .55rem; color: var(--muted); font-size: .8rem; letter-spacing: .06em; }
.main-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem; }
.main-nav a { min-height: 2.75rem; display: inline-flex; align-items: center; padding: .35rem .7rem; text-decoration: none; }
.main-nav a[aria-current="page"] { color: var(--accent); text-decoration: underline; text-underline-offset: .35rem; }
main { width: min(100% - 2rem, var(--content-width)); min-height: calc(100vh - 8rem); margin-inline: auto; padding-block: var(--space-5); }
#route-view { min-width: 0; }
.page-heading { padding-block: .4rem 1.25rem; border-bottom: 1px solid var(--border); }
.eyebrow { margin: 0 0 .35rem; color: var(--accent); font-size: .82rem; letter-spacing: .12em; }
h1, h2, h3 { line-height: 1.35; font-weight: 500; }
h1 { margin: .15rem 0 .55rem; font-size: clamp(1.8rem, 4vw, 2.65rem); }
h2 { margin: 0 0 .65rem; font-size: 1.5rem; }
p { max-width: var(--reading-width); }
.lede { margin: 0; color: var(--muted); }
.chapter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65rem; margin: var(--space-4) 0; padding: 0; list-style: none; }
.chapter-link, .action-link.chapter-link { display: grid; width: 100%; min-height: 3.25rem; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: center; gap: .65rem; padding: .55rem .75rem; border: 1px solid var(--border); background: var(--surface); color: var(--ink); text-align: start; text-decoration: none; }
.chapter-link:hover, .chapter-link:focus-visible, .action-link.chapter-link:hover, .action-link.chapter-link:focus-visible { border-color: var(--accent); background: var(--surface-raised); color: var(--ink); }
.chapter-number { color: var(--accent); font-size: .86rem; }
.chapter-title { overflow-wrap: anywhere; }
.stats { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; padding-block: .8rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .92rem; }
.route-panel { margin-block: var(--space-4); padding: clamp(1rem, 4vw, 2rem); border: 1px solid var(--border); background: var(--surface); }
.route-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-block-start: 1.25rem; }
.action-link, .action-button { display: inline-flex; min-height: 2.8rem; align-items: center; justify-content: center; padding: .45rem .85rem; border: 1px solid var(--moss); background: var(--moss); color: #fff; text-decoration: none; cursor: pointer; }
.action-link:hover, .action-button:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
.action-link.secondary, .action-button.secondary { border-color: var(--border); background: var(--surface-raised); color: var(--moss); }
.route-status { margin-block: 1rem; padding: .65rem .9rem; border-inline-start: 3px solid var(--moss); background: var(--surface); color: var(--ink); }
.route-status[data-kind="error"] { border-color: var(--accent); }
.route-error { color: var(--accent); }
.site-footer { padding: 1.4rem 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .86rem; text-align: center; }
.muted { color: var(--muted); }
code, .id-value { font-family: Consolas, "SFMono-Regular", monospace; font-size: .9em; overflow-wrap: anywhere; }

/* CSS variables cannot be used in media queries: 900px switches to two columns; 620px stacks the navigation. */
@media (max-width: 900px) {
  .chapter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .site-header { align-items: flex-start; flex-direction: column; gap: .45rem; padding-block: .7rem; }
  .main-nav { width: 100%; justify-content: flex-start; gap: .15rem; }
  .main-nav a { padding-inline: .55rem; }
  main { width: min(100% - 1.25rem, var(--content-width)); padding-block: 1.3rem; }
  .chapter-grid { grid-template-columns: 1fr; }
  .chapter-link, .action-link.chapter-link { min-height: 3rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* P5 reader: shared namespace styles. */
.shj-reader { min-width: 0; }
.shj-reader__heading { padding-block: .5rem 1.25rem; border-bottom: 1px solid var(--border); }
.shj-reader__eyebrow { margin: 0 0 .3rem; color: var(--accent); font-size: .9rem; }
.shj-reader__title { margin: .15rem 0 .45rem; font-size: clamp(1.7rem, 4vw, 2.5rem); }
.shj-reader__source-line, .shj-reader__source-note { margin: .25rem 0; color: var(--muted); font-size: .93rem; }
.shj-reader__controls { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem 1rem; padding-block: 1rem; border-bottom: 1px solid var(--border); }
.shj-reader__volume-label { font-weight: 600; }
.shj-reader__volume-select { min-height: 2.75rem; max-width: 100%; padding: .4rem .6rem; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; }
.shj-reader__counts { flex-basis: 100%; margin: 0; color: var(--muted); font-size: .9rem; }
.shj-reader__review-details, .shj-reader__edition-details, .shj-reader__toc, .shj-reader__glyph-source { margin-block: .8rem; padding: .65rem .8rem; border: 1px solid var(--border); background: var(--surface); }
.shj-reader__review-details > summary, .shj-reader__edition-details > summary, .shj-reader__toc > summary, .shj-reader__source-details > summary, .shj-reader__glyph-source > summary { min-height: 2rem; color: var(--moss); cursor: pointer; }
.shj-reader__review-totals, .shj-reader__note { margin: .45rem 0; color: var(--muted); }
.shj-reader__toc-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .2rem .9rem; max-height: 14rem; margin: .5rem 0 0; padding: 0 0 0 1.2rem; overflow: auto; }
.shj-reader__toc-link, .shj-reader__block-link { display: inline-flex; min-height: 2.5rem; align-items: center; padding-inline: .25rem; }
.shj-reader__stream { margin-block-start: 1.25rem; }
.shj-reader__block { min-width: 0; padding: .8rem 0 1rem; border-bottom: 1px solid var(--border); scroll-margin-top: 1rem; }
.shj-reader__block--target { border-inline-start: 3px solid var(--accent); padding-inline-start: .8rem; background: var(--surface); }
.shj-reader__block:focus { outline: 2px solid var(--focus); outline-offset: 3px; }
.shj-reader__block-header { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem .7rem; margin-block-end: .55rem; color: var(--muted); font-size: .84rem; }
.shj-reader__kind { color: var(--accent); font-weight: 600; }
.shj-reader__section-label { color: var(--muted); }
.shj-reader__text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.08rem; line-height: 2; }
.shj-reader__block:has(.shj-reader__kind) .shj-reader__kind { flex: 0 0 auto; }
.shj-reader__separator { min-height: .4rem; border-block-start: 1px dotted var(--border); }
.shj-reader__relations { margin-block-start: .75rem; }
.shj-reader__relations > summary, .shj-reader__relation-card > summary { min-height: 2.6rem; display: flex; align-items: center; color: var(--moss); cursor: pointer; }
.shj-reader__relation-card { margin-block: .45rem; padding-inline: .65rem; border-inline-start: 2px solid var(--border); background: var(--surface); }
.shj-reader__relation-role { display: flex; align-items: baseline; flex-wrap: wrap; gap: .3rem .7rem; padding-block: .35rem; }
.shj-reader__relation-label { color: var(--muted); font-size: .86rem; }
.shj-reader__block-links { display: flex; flex-wrap: wrap; gap: .2rem .6rem; margin: 0; padding: 0; list-style: none; }
.shj-reader__not-linked { color: var(--muted); font-size: .9rem; }
.shj-reader__status { color: var(--ink); }
.shj-reader__review-summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: .4rem .7rem; padding-block: .5rem; }
.shj-reader__review-status { color: var(--moss); }
.shj-reader__review-note, .shj-reader__reason, .shj-reader__evidence { color: var(--muted); }
.shj-reader__issues { flex-basis: 100%; padding: .35rem .55rem; border-inline-start: 2px solid var(--accent); background: var(--surface-raised); }
.shj-reader__issues > summary { min-height: 2.4rem; display: flex; align-items: center; color: var(--accent); cursor: pointer; }
.shj-reader__issues li { margin-block: .35rem; }
.shj-reader__relations > summary::before, .shj-reader__relation-card > summary::before,
.shj-reader__source-details > summary::before, .shj-reader__issues > summary::before { content: "▸"; margin-inline-end: .4rem; }
.shj-reader__relations[open] > summary::before, .shj-reader__relation-card[open] > summary::before,
.shj-reader__source-details[open] > summary::before, .shj-reader__issues[open] > summary::before { content: "▾"; }
.shj-reader__source-list { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem .75rem; margin: .5rem 0 0; }
.shj-reader__source-list dt { color: var(--muted); }
.shj-reader__source-list dd { margin: 0; overflow-wrap: anywhere; }
.shj-reader__source-details { margin-block: .3rem 0; color: var(--muted); font-size: .84rem; }
.shj-reader__source-details > summary { display: inline-flex; align-items: center; min-height: 2.75rem; }
.shj-reader__block[data-kind="heading"] { padding-block: .45rem; }
.shj-reader__block[data-kind="heading"] .shj-reader__text { font-size: 1.25rem; }
.shj-reader__block[data-kind="separator"] { padding-block: .25rem; border-bottom: 0; }
.shj-reader__glyph { display: inline; vertical-align: middle; }
.shj-reader__glyph-link { display: inline-flex; min-width: 2.5rem; min-height: 2.5rem; align-items: center; justify-content: center; vertical-align: middle; }
.shj-reader__glyph-image { display: inline-block; width: 2.3rem; height: 2.3rem; object-fit: contain; border: 1px solid var(--border); background: var(--surface-raised); }
.shj-reader__glyph-note { overflow-wrap: anywhere; }
.shj-reader__glyph-source { margin-block: .5rem; font-size: .92rem; }

@media (max-width: 620px) {
  .shj-reader__controls { align-items: flex-start; flex-direction: column; }
  .shj-reader__volume-select { width: 100%; }
  .shj-reader__toc-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shj-reader__text { font-size: 1rem; }
}


/* P5-4 entry and catalog: integrated shared styles. */
/* 命名空间规则参考；运行时样式集中维护于 src/styles.css。 */
.shj-entry { max-width: 62rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 4rem; }
.shj-entry__eyebrow, .shj-entry__muted { color: var(--muted); }
.shj-entry__title { margin: .25rem 0 1rem; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.35; }
.shj-entry__section { margin-top: 2rem; }
.shj-entry__section h2 { border-bottom: 1px solid var(--border); padding-bottom: .5rem; }
.shj-entry__card, .shj-entry__evidence { margin: 1rem 0; padding: 1rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--surface); }
.shj-entry__card-title { margin: 0 0 .5rem; font-size: 1.2rem; }
.shj-entry__status-row, .shj-entry__location { margin: .35rem 0; }
.shj-entry__links { display: flex; flex-wrap: wrap; gap: .65rem 1rem; margin: .75rem 0; }
.shj-entry a { color: var(--moss); text-underline-offset: .18em; }
.shj-entry a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.shj-entry__details { margin: 1rem 0; }
.shj-entry__details summary { cursor: pointer; font-weight: 600; }
.shj-entry__quote { margin: .75rem 0; padding: .75rem 1rem; border-inline-start: 3px solid var(--accent); background: var(--surface); line-height: 1.9; }
.shj-entry__reason { line-height: 1.8; }
.shj-entry__source-link { display: inline-block; margin: .25rem 0; }

/* 命名空间规则参考；运行时样式集中维护于 src/styles.css。 */
.shj-catalog { max-width: 72rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 4rem; }
.shj-catalog__eyebrow, .shj-catalog__policy, .shj-catalog__status, .shj-catalog__empty { color: var(--muted); }
.shj-catalog__title { margin: .25rem 0 1rem; font-size: clamp(1.8rem, 4vw, 2.7rem); }
.shj-catalog__category-nav { display: flex; flex-wrap: wrap; gap: .5rem .9rem; padding: 1rem 0; border-block: 1px solid var(--border); }
.shj-catalog__category-nav a[aria-current="page"] { font-weight: 700; text-decoration-thickness: 2px; }
.shj-catalog a { color: var(--moss); text-underline-offset: .18em; }
.shj-catalog a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.shj-catalog__overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: .75rem; margin-top: 1rem; }
.shj-catalog__category, .shj-catalog__item { padding: 1rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--surface); }
.shj-catalog__volume { margin: .75rem 0; border: 1px solid var(--border); border-radius: .5rem; background: var(--surface); }
.shj-catalog__volume > summary, .shj-catalog__unresolved > summary { padding: .8rem 1rem; cursor: pointer; font-weight: 600; }
.shj-catalog__volume-content { padding: 0 1rem 1rem; }
.shj-catalog__unresolved { margin-top: 1.5rem; border: 1px solid var(--border); border-radius: .5rem; }
.shj-catalog__definition { max-width: 60rem; line-height: 1.8; }
.shj-catalog__results { margin-top: 1.5rem; }
.shj-catalog__item { margin: .75rem 0; }
.shj-catalog__item h4 { margin: 0 0 .4rem; font-size: 1.1rem; }
.shj-catalog__quote { margin: .6rem 0; padding: .65rem .9rem; border-inline-start: 3px solid var(--accent); line-height: 1.8; }
.shj-catalog__reason { line-height: 1.8; }
.shj-catalog__links { display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin: .6rem 0; }

.shj-entry, .shj-catalog { min-width: 0; overflow-wrap: anywhere; }
.shj-entry a, .shj-catalog a { display: inline-flex; min-height: 2.75rem; align-items: center; }
.shj-entry summary { min-height: 2.75rem; align-content: center; }
.shj-entry mark { background: var(--surface-raised); color: var(--accent); font-weight: 600; }
.shj-catalog__retry { min-height: 2.75rem; padding: .5rem .8rem; color: var(--ink); background: var(--surface-raised); border: 1px solid var(--border); font: inherit; cursor: pointer; }

/* P5-5 search: integrated shared styles. */
/* 待公共框架负责人合并至 src/styles.css；运行时样式集中维护。 */
.shj-search { max-width: 76rem; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 4rem; }
.shj-search__title { margin: .25rem 0 1rem; font-size: clamp(1.8rem, 4vw, 2.7rem); }
.shj-search__intro, .shj-search__source, .shj-search__result-kind, .shj-search__raw-status { color: var(--muted); line-height: 1.7; }
.shj-search__form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--surface); }
.shj-search__field { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: .35rem; min-width: 0; }
.shj-search__field label { font-weight: 600; }
.shj-search input, .shj-search select, .shj-search button { max-width: 100%; min-height: 2.75rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: .35rem; color: var(--ink); background: var(--surface); font: inherit; }
.shj-search__multi { width: 100%; }
.shj-search__actions, .shj-search__pager, .shj-search__links { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
.shj-search button { cursor: pointer; }
.shj-search button:disabled { cursor: not-allowed; opacity: .55; }
.shj-search a { color: var(--moss); text-underline-offset: .18em; }
.shj-search a:focus-visible, .shj-search button:focus-visible, .shj-search input:focus-visible, .shj-search select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.shj-search__status { min-height: 1.8rem; margin: 1rem 0; }
.shj-search__result { margin: 1rem 0; padding: 1rem; border: 1px solid var(--border); border-radius: .5rem; background: var(--surface); }
.shj-search__result-title { margin: 0 0 .4rem; font-size: 1.2rem; overflow-wrap: anywhere; }
.shj-search__states { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
.shj-search__tag { display: inline-block; padding: .15rem .5rem; border: 1px solid var(--border); border-radius: 99rem; color: var(--ink); font-size: .9em; }
.shj-search__excerpt { margin: .65rem 0; padding: .65rem .9rem; border-inline-start: 3px solid var(--accent); line-height: 1.8; overflow-wrap: anywhere; }
.shj-search__assertions { margin: .5rem 0; }
.shj-search__assertions summary { cursor: pointer; }
.shj-search__pager { justify-content: center; margin-top: 1.5rem; }
.shj-search__empty { padding: 1rem; border: 1px solid var(--border); border-radius: .5rem; }
.shj-search__retry { margin-top: .5rem; }

.shj-search { min-width: 0; overflow-wrap: anywhere; }
.shj-search a { display: inline-flex; align-items: center; min-height: 2.75rem; }

/* P5-6 map: integrated shared styles. */
.shj-map a { display: inline-block; min-height: 2.75rem; max-width: 100%; }
.shj-map summary { min-height: 2.75rem; }
.shj-map { max-width: 72rem; margin: 0 auto; overflow-wrap: anywhere; }
.shj-map__notice { color: var(--muted); }
.shj-map__chapters a { display: block; padding: 1rem; border: 1px solid var(--border); background: var(--surface); }
.shj-map__detail:focus { outline: 2px solid var(--focus); outline-offset: 3px; }
.shj-map__graph { margin: 1rem 0; max-width: 32rem; }
.shj-map__graph figcaption { font-weight: bold; }
.shj-map__graph ul { margin: .5rem 0 0 .5rem; padding: 0 0 0 1.5rem; border-left: 2px solid var(--accent); list-style: none; }
.shj-map__graph li { position: relative; margin: .75rem 0; padding: .6rem; border: 1px solid var(--moss); overflow-wrap: anywhere; }
.shj-map__graph li::before { content: ""; position: absolute; width: 1.5rem; border-top: 2px solid var(--accent); left: -1.5rem; top: 50%; }
.shj-map__endpoint, .shj-map__review { border-top: 1px solid var(--border); padding: .6rem 0; }
.shj-map__relations li { margin: .6rem 0; }
.shj-map summary { cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="wordmark" href="#/" data-route-target="home" aria-label="山海经数字读本首页">山海经<span>数字读本</span></a>
    <nav class="main-nav" aria-label="主导航">
      <a href="#/" data-route-target="home" data-nav="home">总览</a>
      <a href="#/search" data-route-target="search" data-nav="search">检索</a>
      <a href="#/map" data-route-target="map" data-nav="map">经文空间</a>
      <a href="#/catalog" data-route-target="catalog" data-nav="catalog">分类册</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <p class="reader-directory-link"><a href="../index.html">返回网页目录 ↗</a></p>
    <div id="route-status" class="route-status" role="status" aria-live="polite" hidden></div>
    <section id="route-view" aria-live="off" aria-busy="false"></section>

    requireVolume(route.volumeId);
    const volume = await data.getVolume(route.volumeId, { signal });
    if (route.type === "reader") {
      let block = null;
      if (route.blockKey) {
        block = volume.p1.sourceBlocks.find(item => {
          const id = item.blockId;
          return `${id.volumeId}:${id.blockOrder}:${id.kind}` === route.blockKey;
        });
        if (!block) fail(`篇章位置 ${route.blockKey} 不存在。`, "missing_id");
      }
      return { route, volume, block };
    }
    if (route.type === "entry") {
      const entry = volume.p3.entries.find(item => item.entryId === route.id);
      if (!entry) fail(`条目 ${route.id} 不存在。`, "missing_id");
      return { route, volume, entry };
    }
    if (route.type === "occurrence") {
      const occurrence = volume.p3.occurrences.find(item => item.occurrenceId === route.id);
      if (!occurrence) fail(`文本出现 ${route.id} 不存在。`, "missing_id");
      return { route, volume, occurrence };
    }
    if (route.type === "candidate") {
      const candidate = volume.p3.entityCandidates.find(item => item.entityCandidateId === route.id);
      if (!candidate) fail(`实体候选 ${route.id} 不存在。`, "missing_id");
      return { route, volume, candidate };
    }
    if (route.type === "map") {
      const relation = route.relationId ? volume.p4Relations.find(item => item.relationId === route.relationId) : null;
      if (route.relationId && !relation) fail(`空间关系 ${route.relationId} 不存在。`, "missing_id");
      return { route, volume, relation };
    }
    fail(`不支持的路由类型：${route.type}`);
  }

  function navigate(target) {
    const href = linkTo(target);
    if (location.hash === href) void renderRoute(parseRoute(href), false);
    else location.hash = href;
    return href;
  }

  function registerFeature(name, mount) {
    if (!["reader", "entry", "occurrence", "candidate", "entity", "catalog", "search", "map"].includes(name)) fail(`未知模块名：${name}`);
    if (typeof mount !== "function") fail("模块挂载函数必须是函数。");
    if (features.has(name)) fail("模块 " + name + " 已注册。");
    features.set(name, mount);
    if (currentRoute.type === name) void renderRoute(currentRoute, false);
    return () => {
      if (features.get(name) === mount) {
        features.delete(name);
        if (currentRoute.type === name) void renderRoute(currentRoute, false);
      }
    };
  }

  function makeLink(target, text, className = "action-link") {
    const anchor = document.createElement("a");
    anchor.className = className;
    anchor.href = linkTo(target);
    anchor.textContent = text;
    return anchor;
  }

  function volumeLabel(volume) {
    return volume.chapterTitle ? volume.title + " · " + volume.chapterTitle : volume.title;
  }

  function defaultRouteTitle(route, target) {
    const pageLabels = { reader: "经文读本", entry: "条目", occurrence: "文本出现", candidate: "实体候选", entity: "整理实体", catalog: "分类册", search: "检索", map: "经文空间" };
    if (route.type === "catalog" && target.category) return target.category.label + " · 山海经";
    const volume = target.volume ? volumeLabel(target.volume) : "";
    const page = pageLabels[route.type] || "山海经";
    return volume ? page + " · " + volume + " · 山海经" : page + " · 山海经";
  }

  function setStatus(message, kind = "info", visible = true) {
    status.textContent = message;
    status.dataset.kind = kind;
    status.hidden = !visible;
  }

  function setCurrentNavigation(route) {
    const navName = route.type === "home" || route.type === "reader" ? "home" : route.type === "catalog" ? "catalog" : route.type === "search" ? "search" : route.type === "map" ? "map" : "";

    if (navName) document.querySelector(`.main-nav [data-nav="${navName}"]`)?.setAttribute("aria-current", "page");
  }

  function showHome(manifest) {
    const heading = document.createElement("header");
    heading.className = "page-heading";
    heading.innerHTML = '<p class="eyebrow">十八篇</p><h1>山海经</h1><p class="lede">选择一篇，进入经文与相关资料的浏览入口。</p>';
    const list = document.createElement("ol");
    list.className = "chapter-grid";
    for (const chapter of bootstrap.volumes) {
      const item = document.createElement("li");
      const anchor = makeLink({ type: "reader", volumeId: chapter.volumeId }, "");
      anchor.classList.add("chapter-link");
      const number = document.createElement("span");
      number.className = "chapter-number";
      number.textContent = String(chapter.order).padStart(2, "0");
      const title = document.createElement("span");
      title.className = "chapter-title";
      title.textContent = volumeLabel(chapter);
      anchor.append(number, title);
      item.append(anchor);
      list.append(item);
    }
    const stats = document.createElement("p");
    stats.className = "stats";
    stats.textContent = `原文段落 ${manifest.coverage.p1OriginalBlocks} · 文本出现 ${manifest.coverage.p3Occurrences} · 空间关系 ${manifest.coverage.p4Relations}`;
    view.replaceChildren(heading, list, stats);
    document.title = "山海经 · 总览";
  }

  function showPlaceholder(target) {
    const route = target.route;
    const chapter = route.volumeId ? volumeById.get(route.volumeId) : null;
    const section = document.createElement("section");
    section.className = "route-panel";
    const eyebrow = document.createElement("p");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = chapter ? volumeLabel(chapter) : "公共页面接口";
    const title = document.createElement("h1");
    const labels = { reader: "经文读本", entry: "条目", occurrence: "文本出现", candidate: "实体候选", entity: "整理实体", catalog: "分类册", search: "检索", map: "经文空间关系" };
    title.textContent = labels[route.type] || "页面";
    const description = document.createElement("p");
    description.className = "lede";
    description.textContent = features.has(route.type)
      ? "模块正在准备内容。若内容未出现，请返回总览后重试。"
      : "此页面入口和数据引用已就绪，具体浏览模块将在后续步骤接入。";
    section.append(eyebrow, title, description);
    if (route.id || route.blockKey || route.relationId) {
      const id = document.createElement("p");
      id.className = "id-value muted";
      id.textContent = route.id || route.blockKey || route.relationId;
      section.append(id);
    }
    if (route.type === "map" && !chapter) {
      const chooser = document.createElement("ul");
      chooser.className = "chapter-grid";
      for (const item of bootstrap.volumes) {
        const row = document.createElement("li");
        row.append(makeLink({ type: "map", volumeId: item.volumeId }, volumeLabel(item), "chapter-link"));
        chooser.append(row);
      }
      section.append(chooser);
    }
    const actions = document.createElement("div");
    actions.className = "route-actions";
    actions.append(makeLink(chapter ? { type: "reader", volumeId: chapter.volumeId } : { type: "home" }, chapter ? "打开本篇" : "返回总览"));
    if (chapter) actions.append(makeLink({ type: "home" }, "选择其它篇" , "action-link secondary"));
    section.append(actions);
    view.replaceChildren(section);
    document.title = `${title.textContent} · 山海经`;
  }

  function showError(error) {
    const panel = document.createElement("section");
    panel.className = "route-panel";
    const title = document.createElement("h1");
    title.className = "route-error";
    title.textContent = error.code === "invalid_route" ? "链接无法打开" : "内容暂时无法读取";
    const detail = document.createElement("p");
    detail.textContent = error.message || "加载失败。";
    const actions = document.createElement("div");
    actions.className = "route-actions";
    const retry = document.createElement("button");
    retry.className = "action-button";
    retry.type = "button";
    retry.textContent = "重试";
    retry.addEventListener("click", () => {
      if (error.code === "feature_asset") location.reload();
      else void renderRoute(currentRoute, false);
    });
    actions.append(retry, makeLink({ type: "home" }, "返回总览", "action-link secondary"));
    panel.append(title, detail);
    if (location.protocol === "file:") {
      const command = document.createElement("p");
      command.className = "muted";
      command.textContent = "请在项目根目录启动本地服务后访问 http://localhost:8000：";
      const code = document.createElement("code");
      code.textContent = "python -m http.server 8000";
      panel.append(command, code);
    }
    panel.append(actions);
    view.replaceChildren(panel);
    document.title = "无法打开 · 山海经";
  }

  async function renderRoute(route, focusHeading = true) {
    currentRoute = route;
    const version = ++renderVersion;
    if (activeController) activeController.abort();
    if (typeof activeCleanup === "function") {
      try { activeCleanup(); } catch (error) { console.error("模块清理失败", error); }
      activeCleanup = null;
    }
    view.replaceChildren();
    const controller = new AbortController();
    activeController = controller;
    const { signal } = controller;
    view.setAttribute("aria-busy", "true");
    setStatus("正在读取页面数据…", "info", true);
    setCurrentNavigation(route);
    try {
      const manifest = await data.getManifest({ signal });
      if (featureErrors.has(route.type)) throw featureErrors.get(route.type);
      const target = await resolveTarget(route, { signal });
      if (version !== renderVersion || signal.aborted) return;
      setStatus("", "info", false);
      document.title = route.type === "home" ? "山海经 · 总览" : defaultRouteTitle(route, target);
      const mount = features.get(route.type);
      if (route.type === "home") showHome(manifest);
      else if (!mount) showPlaceholder(target);
      else {
        const featureRoot = document.createElement("div");
        featureRoot.className = "feature-mount";
        view.replaceChildren(featureRoot);
        const cleanups = [];
        let returnedCleanup = null;
        let returnedCleanupDone = false;
        let disposed = false;
        const cleanup = () => {
          disposed = true;
          for (const fn of cleanups.splice(0).reverse()) {
            try { fn(); } catch (error) { console.error("模块清理失败", error); }
          }
          if (!returnedCleanupDone && typeof returnedCleanup === "function") {
            returnedCleanupDone = true;
            try { returnedCleanup(); } catch (error) { console.error("模块清理失败", error); }
          }
        };
        activeCleanup = cleanup;
        const context = Object.freeze({
          container: featureRoot,
          route,
          target,
          href: linkTo,
          navigate,
          data,
          signal,
          onCleanup(cleanupFn) {
            if (typeof cleanupFn !== "function") fail("onCleanup 需要函数。");
            if (disposed) cleanupFn();
            else cleanups.push(cleanupFn);
          }
        });
        try { returnedCleanup = await mount(featureRoot, context); }
        catch (error) { cleanup(); throw error; }
        if (version !== renderVersion || signal.aborted) cleanup();
      }
      if (version === renderVersion && focusHeading) {
        if (route.type !== "reader" || !route.blockKey) {
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
        }
        const heading = view.querySelector("h1");
        if (heading) {
          heading.tabIndex = -1;
          heading.focus({ preventScroll: true });
        }
      }
      void manifest;
    } catch (error) {
      if (signal.aborted || version !== renderVersion || error.name === "AbortError") return;
      setStatus(error.message, "error", true);
      showError(error);
    } finally {
      if (version === renderVersion) view.setAttribute("aria-busy", "false");
    }
  }

  const api = Object.freeze({
    ready,
    bootstrap,
    data,
    linkTo,
    parseRoute,
    navigate,
    resolveTarget,
    registerFeature
  });
  window.SHJ = api;
  window.addEventListener("error", event => {
    const feature = event.target?.dataset?.feature;
    if (event.target?.tagName !== "SCRIPT" || !["search", "map"].includes(feature)) return;
    const label = feature === "map" ? "空间地图" : "检索";
    featureErrors.set(feature, Object.assign(new Error(`${label}脚本未能加载，请重试重新加载页面。`), { code: "feature_asset" }));
    if (currentRoute.type === feature) void renderRoute(currentRoute, false);
  }, true);
  document.querySelector(".skip-link").addEventListener("click", event => {
    event.preventDefault();
    const main = document.getElementById("main");
    main.focus({ preventScroll: true });
    main.scrollIntoView({ block: "start" });
  });
  window.addEventListener("hashchange", () => {
    try { void renderRoute(parseRoute(location.hash)); }
    catch (error) { currentRoute = { type: "unknown" }; void renderRoute({ type: "unknown", error }); }
  });

  try { void renderRoute(parseRoute(location.hash), false); }
  catch (error) { currentRoute = { type: "unknown" }; void renderRoute({ type: "unknown", error }, false); }
})();

  <script>(() => {

  const NOTE_REVIEW_LABELS = {

  function glyphStatus(record) {

    }
    for (const row of volume.p1.noteRelations) attach("note", row, null);
    for (const row of volume.p1.structuralGroups) attach("structure", row, null);
    for (const row of volume.p1.contentPairChecks) attach("pair", row, reviewMap.get(refsKey(row)) || null);
    return bySource;
  }

  function reviewIndex(globalData, volumeId) {
    const byPair = new Map();
    const sides = globalData.p1ReviewDetails[volumeId] || {};
    for (const reviewPack of Object.values(sides)) {
      for (const row of reviewPack.reviews || []) byPair.set(refsKey(row), row);
    }
    return byPair;
  }

  function addReviewSummary(parent, globalData, volumeId) {
    const status = (globalData.p1ReviewStatus.volumes || []).find(row => row.volumeId === volumeId);
    if (!status) return;
    const details = element("details", "shj-reader__review-details");
    details.append(element("summary", null, "本篇复核与未定状态"));
    const summary = element("p", "shj-reader__review-totals");
    summary.textContent = "实际复核记录 " + status.reviewsAccepted + "/" + status.ruleQueueItems + " 项；复核不支持 " + status.modelRejected + " 项；复核未定 " + status.modelUnresolved + " 项；尚待复核 " + status.pendingReview + " 项；解释分歧 " + status.interpretationIssueItems + " 项。";
    details.append(summary);
    if (status.ruleQueueItems > 0 && status.pendingReview === 0 && status.reviewsAccepted === status.ruleQueueItems) {
      details.append(element("p", "shj-reader__note", "原规则记录了 " + status.rulePendingModelReview + " 项待复核和 " + status.ruleUnresolved + " 项未定；复核队列的实际记录均已到齐，规则状态与实际复核结论分别保留。"));
    } else if (status.pendingReview > 0 || status.reviewsAccepted < status.ruleQueueItems) {
      const outstanding = Math.max(status.pendingReview, status.ruleQueueItems - status.reviewsAccepted);
      details.append(element("p", "shj-reader__note", "仍有 " + outstanding + " 项复核队列没有对应的已接收实际复核记录，保留为待处理。"));
    }
    parent.append(details);
  }
  function renderBlock(block, volume, relations, glyphByBlock, glyphRecords, baseUrl, deepBlockKey) {
    const id = block.blockId;
    const article = element("article", "shj-reader__block");
    article.id = blockDomId(block);
    article.tabIndex = -1;
    article.dataset.blockKey = idKey(id);
    article.dataset.kind = id.kind;
    if (idKey(id) === deepBlockKey) article.classList.add("shj-reader__block--target");
    const heading = element("header", "shj-reader__block-header");
    heading.append(element("span", "shj-reader__kind", KIND_LABELS[id.kind] || id.kind));
    heading.append(element("span", "shj-reader__block-number", "块 " + id.blockOrder));
    if (block.sectionLabel) heading.append(element("span", "shj-reader__section-label", block.sectionLabel));
    article.append(heading);
    const content = element(id.kind === "heading" ? "h2" : "p", "shj-reader__text");
    if (id.kind !== "heading") content.lang = id.kind === "original" ? "zh-Hant" : "zh";
    const glyphReferences = (glyphByBlock.get(idKey(id)) || []).filter(row => row.reference.xhtmlPath === block.xhtmlPath);
    const rawGlyphs = appendSourceText(content, block, glyphReferences, glyphRecords, baseUrl);
    if (block.text) article.append(content);
    else article.append(element("div", "shj-reader__separator", "书内分隔位置"));
    if (rawGlyphs.length) {
      const glyphDetails = element("details", "shj-reader__glyph-source");
      glyphDetails.append(element("summary", null, "原始字形占位与资源 " + rawGlyphs.length + " 处"));
      for (const item of rawGlyphs) {
        const row = item.row;
        const note = element("p", "shj-reader__glyph-note");
        note.append(element("code", null, item.sourceToken));
        note.append(document.createTextNode(" · " + item.status + " · " + row.reference.xhtmlPath + " · 字符偏移 " + row.reference.offset + " · "));
        if (item.glyphRendered) {
          const asset = element("a", null, "打开图像预览");
          asset.href = new URL(row.targetPath, baseUrl).href;
          asset.target = "_blank";
          asset.rel = "noopener";
          note.append(asset);
        }
        glyphDetails.append(note);
      }
      article.append(glyphDetails);
    }
    if (relations.length) {
      const index = element("details", "shj-reader__relations");
      index.append(element("summary", null, `相关关系与复核 ${relations.length} 项`));
      for (const relation of relations) index.append(relationCard(relation.type, relation.row, relation.review));
      article.append(index);
    }
    article.append(sourceDetails(block, volume));
    return article;
  }

  async function mountReader(container, context) {
    container.classList.add("shj-reader");
    const volume = context.target.volume;
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const summary = (globalData.p1ReviewStatus.volumes || []).find(row => row.volumeId === volume.volumeId);
    const title = element("header", "shj-reader__heading");
    title.append(element("p", "shj-reader__eyebrow", volume.title));
    title.append(element("h1", "shj-reader__title", volume.chapterTitle));
    const identity = globalData.sourceIdentity;
    const edition = identity.edition;
    const authors = (edition.authors || []).map(author => author.name + (author.role ? " · " + author.role : "")).join("；");
    const sourceLine = [edition.title, authors, edition.publisher, edition.publicationYear, edition.isbn].filter(Boolean).join(" · ");
    if (sourceLine) title.append(element("p", "shj-reader__source-line", sourceLine));
    title.append(element("p", "shj-reader__source-note", "原文、译文与注释来自项目登记的方韬译注用户副本；译注以原导入身份展示，本模块不补译或改写。"));

    const controls = element("div", "shj-reader__controls");
    const label = element("label", "shj-reader__volume-label", "选择篇章");
    const select = element("select", "shj-reader__volume-select");
    select.id = "shj-reader-volume-select";
    for (const item of SHJ.bootstrap.volumes) {
      const option = element("option", null, item.title + (item.chapterTitle ? " · " + item.chapterTitle : ""));
      option.value = item.volumeId;
      option.selected = item.volumeId === volume.volumeId;
      select.append(option);
    }
    label.htmlFor = select.id;
    controls.append(label, select);
    const summaryCounts = element("p", "shj-reader__counts");
    const kindCounts = volume.coverage.p1BlockKinds || {};
    summaryCounts.textContent = `原文 ${kindCounts.original || 0} 块 · 译文 ${kindCounts.translation || 0} 块 · 注释 ${kindCounts.note || 0} 块`;
    controls.append(summaryCounts);
    if (summary) addReviewSummary(controls, globalData, volume.volumeId);

    const originalBlocks = volume.p1.sourceBlocks.filter(block => block.blockId.kind === "original");
    const toc = element("details", "shj-reader__toc");
    toc.append(element("summary", null, `本篇原文目录 ${originalBlocks.length} 段`));
    const tocList = element("ol", "shj-reader__toc-list");
    for (const block of originalBlocks) {
      const row = element("li");
      const link = element("a", "shj-reader__toc-link", "原文块 " + block.blockId.blockOrder);
      link.href = SHJ.linkTo({ type: "reader", volumeId: volume.volumeId, blockKey: idKey(block.blockId) });
      row.append(link);
      tocList.append(row);
    }
    toc.append(tocList);

    const rawBlocks = volume.p1.sourceBlocks.slice().sort((a, b) => a.blockId.blockOrder - b.blockId.blockOrder);
    const reviewMap = reviewIndex(globalData, volume.volumeId);
    const relationIndex = indexRelations(volume, reviewMap);
    const glyphRecords = new Map(globalData.glyphCandidates.records.map(record => [record.stableId, record]));
    const glyphByBlock = new Map();
    for (const row of globalData.glyphReferenceIndex) {
      if (row.reference.volumeId !== volume.volumeId) continue;
      const key = [row.reference.volumeId, row.reference.blockOrder, row.blockKind].join(":");
      if (!glyphByBlock.has(key)) glyphByBlock.set(key, []);
      glyphByBlock.get(key).push(row);
    }
    const baseUrl = new URL(SHJ.bootstrap.dataBase, document.baseURI);
    const stream = element("div", "shj-reader__stream");
    const deepBlockKey = context.route.blockKey || null;
    for (const block of rawBlocks) {
      stream.append(renderBlock(block, volume, relationIndex.get(idKey(block.blockId)) || [], glyphByBlock, glyphRecords, baseUrl, deepBlockKey));
    }
    const sourceDetailsElement = element("details", "shj-reader__edition-details");
    sourceDetailsElement.append(element("summary", null, "版本来源说明"));
    if (edition.editionStatement) sourceDetailsElement.append(element("p", null, edition.editionStatement));
    if (identity.source.copyrightAndProvenance) sourceDetailsElement.append(element("p", null, identity.source.copyrightAndProvenance));

    container.replaceChildren(title, controls, toc, sourceDetailsElement, stream);
    const onVolumeChange = () => SHJ.navigate({ type: "reader", volumeId: select.value });
    select.addEventListener("change", onVolumeChange);
    if (context.target.block) {
      const targetId = blockDomId(context.target.block);
      requestAnimationFrame(() => {
        if (context.signal.aborted) return;
        const target = container.querySelector("#" + CSS.escape(targetId));
        if (target) {
          target.scrollIntoView({ block: "start" });
          target.focus({ preventScroll: true });
        }
      });
    }
    return () => {
      select.removeEventListener("change", onVolumeChange);
      container.replaceChildren();
    };
  }

  SHJ.registerFeature("reader", mountReader);
})();
</script>
  <script>(function registerEntryFeatures() {
  "use strict";

  const SHJ = window.SHJ;
  const OCCURRENCE_STATUS = {
    named: "具名出现",
    descriptive: "描述性出现",
    unresolved: "出现身份未定"
  };
  const ENTRY_STATUS = {
    semantic_candidate: "整理条目候选",
    accepted: "整理条目已接受",
    unresolved: "整理条目未定"
  };
  const IDENTITY_STATUS = {
    unmerged_candidate: "尚未归并的实体候选",
    unresolved: "实体身份未定",
    ambiguous: "实体身份有歧义",
    pending: "身份待处理"
  };
  const BETWEEN_PARTITION_STATUS = {
    distinct_entities: "分区间判为不同指称",
    unresolved: "分区间身份尚未确定"
  };
  const REFERENT_LEVEL = {
    individual: "个体",
    place: "地点",
    kind: "类别或种类",
    collective: "群体",
    undetermined: "指称层级尚未确定"
  };
  const IDENTITY_BASIS = {
    original_explicit: "原文直接依据",
    insufficient: "依据不足",
    auxiliary_interpretation: "辅助释读依据"
  };
  const SOURCE_LAYER = { original: "原文" };
  const REVIEW_STATUS = {
    reviewed: "已复核",
    reviewed_with_ambiguity: "复核含歧义"
  };
  const CATEGORY_STATUS = {
    supported: "分类规则支持",
    candidate: "分类候选",
    unresolved: "分类未定",
    pending: "分类待处理",
    rejected: "分类未接受",
    rule_boundary_flag: "分类边界待核"
  };

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function heading(parent, level, text, className) {
    const node = el("h" + level, className, text);
    parent.append(node);
    return node;
  }

  function link(target, label, className) {
    const node = el("a", className, label);
    node.href = SHJ.linkTo(target);
    return node;
  }

  function statusText(map, value, fallback) {
    return map[value] || (value ? String(value) : fallback);
  }

  function volumeLabel(volume) {
    return [volume.title, volume.chapterTitle].filter(Boolean).join(" · ");
  }

  function addStatus(parent, label, value, map, fallback) {
    const row = el("p", "shj-entry__status-row");
    row.append(el("strong", null, label + "："), document.createTextNode(statusText(map, value, fallback)));
    parent.append(row);
  }

  function addSourceLink(parent, occurrence) {
    parent.append(link({
      type: "reader",
      volumeId: occurrence.volumeId,
      blockKey: [occurrence.volumeId, occurrence.blockOrder, occurrence.sourceLayer || "original"].join(":")
    }, `原文块 ${occurrence.blockOrder} · 字符 ${occurrence.start}–${occurrence.end}`, "shj-entry__source-link"));
  }

  function findOccurrence(volume, id) {
    return volume.p3.occurrences.find(row => row.occurrenceId === id) || null;
  }

  function findBlock(volume, occurrence) {
    return volume.p1.sourceBlocks.find(block =>
      block.blockId.volumeId === occurrence.volumeId &&
      block.blockId.blockOrder === occurrence.blockOrder &&
      block.blockId.kind === occurrence.sourceLayer
    ) || null;
  }

  function sourceSpan(volume, occurrence) {
    const block = findBlock(volume, occurrence);
    if (!block || typeof block.text !== "string") return null;
    const text = Array.from(block.text);
    if (occurrence.start < 0 || occurrence.end < occurrence.start || occurrence.end > text.length) return null;
    return { block, text: text.slice(occurrence.start, occurrence.end).join("") };
  }

  function categoriesFor(volume, occurrenceId) {
    return volume.p3.categoryOverlay.filter(row => row.occurrenceId === occurrenceId);
  }

  function addCategoryEvidence(parent, volume, occurrence, globalData) {
    const overlays = categoriesFor(volume, occurrence.occurrenceId);
    const details = el("details", "shj-entry__details");
    details.append(el("summary", null, "分类判定与证据 " + overlays.length + " 项"));
    if (!overlays.length) details.append(el("p", "shj-entry__muted", "本出现没有分类 overlay 记录；这不表示已确认无类别。"));
    const categoryById = new Map((globalData.taxonomy.categories || []).map(row => [row.categoryId, row]));
    for (const row of overlays) {
      const names = (row.categoryIds || []).map(id => {
        const category = categoryById.get(id);
        return category ? category.label + "（" + id + "）" : id;
      });
      const item = el("section", "shj-entry__evidence");
      item.append(el("h4", null, names.length ? names.join("、") : "未给出类别"));
      addStatus(item, "类别状态", row.categoryStatus, CATEGORY_STATUS, "未提供");
      addStatus(item, "复核状态", row.reviewStatus, REVIEW_STATUS, "未提供");
      if (row.contextQuote) item.append(el("blockquote", "shj-entry__quote", row.contextQuote));
      if (row.rationale) item.append(el("p", "shj-entry__reason", row.rationale));
      details.append(item);
    }
    parent.append(details);
  }

  function addIdentityEvidence(parent, candidate, globalData) {
    const candidateId = candidate.entityCandidateId;
    const canonical = globalData.identityOverlay.canonicalEntities.find(entity => entity.candidateIds.includes(candidateId));
    if (canonical) {
      const accepted = el("section", "shj-entry__evidence");
      accepted.append(el("p", null, "身份整理记录中有明确的整理实体归并记录："));
      accepted.append(link({ type: "entity", id: canonical.entityId }, "查看整理实体 " + canonical.entityId));
      if (canonical.reason) accepted.append(el("p", "shj-entry__reason", canonical.reason));
      parent.append(accepted);
    }
    const findings = (globalData.identityOverlay.nonPhysicalFindings || []).filter(row => (row.memberCandidateIds || []).includes(candidateId));
    for (const finding of findings) {
      const note = el("section", "shj-entry__evidence");
      note.append(el("p", null, "非个体或地点实体的身份记录：" + statusText(REFERENT_LEVEL, finding.referentLevel, "指称层级未提供") + " · " + statusText({ same_entity: "归为同一指称" }, finding.status, "状态未提供")));
      if (finding.reason) note.append(el("p", "shj-entry__reason", finding.reason));
      if (finding.basis) note.append(el("p", "shj-entry__muted", "依据：" + statusText(IDENTITY_BASIS, finding.basis, finding.basis)));
      if (finding.taskId) note.append(el("p", "shj-entry__muted", "身份任务：" + finding.taskId));
      const links = el("div", "shj-entry__links");
      for (const id of finding.evidenceOccurrenceIds || []) {
        const volumeRow = SHJ.bootstrap.volumes.find(row => String(id).startsWith(row.volumeId + "-"));
        if (volumeRow) links.append(link({ type: "occurrence", volumeId: volumeRow.volumeId, id }, "身份依据出现 · " + volumeRow.title));
      }
      if (links.childNodes.length) note.append(links);
      parent.append(note);
    }
    const decisions = (globalData.identityOverlay.decisions || []).filter(decision =>
      (decision.partitions || []).some(partition => (partition.memberCandidateIds || []).includes(candidateId))
    );
    for (const decision of decisions) {
      const partitions = decision.partitions.filter(partition => (partition.memberCandidateIds || []).includes(candidateId));
      for (const partition of partitions) {
        const note = el("section", "shj-entry__evidence");
        note.append(el("p", null, "身份复核分区 · " + statusText({
          same_entity: "判为同一指称",
          distinct_entities: "判为不同指称",
          unresolved: "身份未定"
        }, partition.status, "分区状态未提供")));
        if (decision.betweenPartitionsStatus) note.append(el("p", "shj-entry__muted", "分区之间状态：" + statusText(BETWEEN_PARTITION_STATUS, decision.betweenPartitionsStatus, decision.betweenPartitionsStatus)));
        if (partition.referentLevel) note.append(el("p", "shj-entry__muted", "指称层级：" + statusText(REFERENT_LEVEL, partition.referentLevel, partition.referentLevel)));
        if (partition.basis) note.append(el("p", "shj-entry__muted", "依据类型：" + statusText(IDENTITY_BASIS, partition.basis, partition.basis)));
        if (partition.reason) note.append(el("p", "shj-entry__reason", partition.reason));
        if (decision.betweenPartitionsReason) note.append(el("p", "shj-entry__reason", "分区间判断：" + decision.betweenPartitionsReason));
        if (decision.taskId) note.append(el("p", "shj-entry__muted", "身份任务：" + decision.taskId));
        const evidenceIds = [...new Set([...(partition.evidenceOccurrenceIds || []), ...(decision.betweenPartitionsEvidenceOccurrenceIds || [])])];
        if (evidenceIds.length) {
          const evidenceLinks = el("div", "shj-entry__links");
          for (const id of evidenceIds) {
            const volumeRow = SHJ.bootstrap.volumes.find(row => String(id).startsWith(row.volumeId + "-"));
            if (volumeRow) evidenceLinks.append(link({ type: "occurrence", volumeId: volumeRow.volumeId, id }, "身份依据出现 · " + volumeRow.title));
            else evidenceLinks.append(el("span", "shj-entry__muted", "未绑定篇章的身份引用：" + id));
          }
          note.append(evidenceLinks);
        }
        const auxiliary = [...new Set([...(partition.auxiliaryRefs || []), ...(decision.betweenPartitionsAuxiliaryRefs || [])])];
        if (auxiliary.length) note.append(el("p", "shj-entry__muted", "辅助引用：" + auxiliary.join("；")));
        parent.append(note);
      }
    }
    if (!canonical && !findings.length && !decisions.length) parent.append(el("p", "shj-entry__muted", "身份整理记录未将此候选归并为整理实体，也未登记非个体/地点身份或复核分区结论；候选状态继续单独保留。"));
    return canonical;
  }

  function appendOccurrenceCard(parent, volume, occurrence, globalData, opts = {}) {
    const card = el("article", "shj-entry__card");
    card.dataset.occurrenceId = occurrence.occurrenceId;
    const span = sourceSpan(volume, occurrence);
    card.append(el("h3", "shj-entry__card-title", span ? span.text : occurrence.surface || "原文跨度不可用"));
    addStatus(card, "出现形式", occurrence.mentionForm, OCCURRENCE_STATUS, "已记录");
    addStatus(card, "来源层", occurrence.sourceLayer, SOURCE_LAYER, "未提供");
    card.append(el("p", "shj-entry__location", `${volumeLabel(volume)} · 原文块 ${occurrence.blockOrder} · 字符 ${occurrence.start}–${occurrence.end}`));
    const nav = el("div", "shj-entry__links");
    nav.append(link({ type: "occurrence", volumeId: volume.volumeId, id: occurrence.occurrenceId }, "查看文本出现"));
    nav.append(link({ type: "candidate", volumeId: volume.volumeId, id: occurrence.entityCandidateId }, "查看实体候选"));
    if (occurrence.entryId) nav.append(link({ type: "entry", volumeId: volume.volumeId, id: occurrence.entryId }, "查看整理条目"));
    nav.append(link({ type: "reader", volumeId: volume.volumeId, blockKey: [volume.volumeId, occurrence.blockOrder, occurrence.sourceLayer || "original"].join(":") }, "打开读本原文"));
    card.append(nav);
    if (span && span.text !== occurrence.surface) {
      card.append(el("p", "shj-entry__muted", "原始抽取记录的显示词形与当前原文跨度不同，二者均保留。"));
    }
    if (opts.includeCategories) addCategoryEvidence(card, volume, occurrence, globalData);
    parent.append(card);
    return card;
  }

  async function mountEntry(container, context) {
    const { volume, entry } = context.target;
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const root = el("div", "shj-entry");
    root.dataset.entryId = entry.entryId;
    root.append(el("p", "shj-entry__eyebrow", volumeLabel(volume)));
    heading(root, 1, entry.displayText || "未命名条目", "shj-entry__title");
    addStatus(root, "整理条目状态", entry.status, ENTRY_STATUS, "未提供");
    root.append(el("p", "shj-entry__muted", "整理条目是对文本材料的组织记录；它不等同于实体确认。"));
    const related = el("section", "shj-entry__section");
    heading(related, 2, "文本出现与实体候选");
    const occurrences = (entry.occurrenceRefs || []).map(id => findOccurrence(volume, id)).filter(Boolean);
    if (!occurrences.length) related.append(el("p", "shj-entry__muted", "没有可回指的文本出现记录。"));
    for (const occurrence of occurrences) appendOccurrenceCard(related, volume, occurrence, globalData, { includeCategories: true });
    root.append(related);
    container.replaceChildren(root);
    document.title = (entry.displayText || "条目") + " · 山海经";
    return () => container.replaceChildren();
  }

  async function mountOccurrence(container, context) {
    const { volume, occurrence } = context.target;
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const root = el("div", "shj-entry");
    root.dataset.occurrenceId = occurrence.occurrenceId;
    root.append(el("p", "shj-entry__eyebrow", volumeLabel(volume) + " · 文本出现"));
    const span = sourceSpan(volume, occurrence);
    heading(root, 1, span ? span.text : occurrence.surface || "文本出现", "shj-entry__title");
    addStatus(root, "出现形式", occurrence.mentionForm, OCCURRENCE_STATUS, "已记录");
    root.append(el("p", "shj-entry__location", `原文块 ${occurrence.blockOrder} · 字符 ${occurrence.start}–${occurrence.end} · 来源哈希 ${occurrence.sourceTextSha256 || "未提供"}`));
    const candidate = volume.p3.entityCandidates.find(row => row.entityCandidateId === occurrence.entityCandidateId);
    const entry = volume.p3.entries.find(row => row.entryId === occurrence.entryId);
    if (entry) {
      addStatus(root, "整理条目状态", entry.status, ENTRY_STATUS, "未提供");
      root.append(link({ type: "entry", volumeId: volume.volumeId, id: entry.entryId }, "打开整理条目"));
    }
    if (candidate) {
      addStatus(root, "原始候选状态", candidate.identityStatus, IDENTITY_STATUS, "候选身份已记录");
      root.append(link({ type: "candidate", volumeId: volume.volumeId, id: candidate.entityCandidateId }, "打开实体候选"));
      addIdentityEvidence(root, candidate, globalData);
    }
    const evidence = el("section", "shj-entry__section");
    heading(evidence, 2, "原文来源");
    if (span) {
      const quote = el("blockquote", "shj-entry__quote");
      const sourceCodepoints = Array.from(span.block.text);
      quote.append(document.createTextNode(sourceCodepoints.slice(Math.max(0, occurrence.start - 32), occurrence.start).join("")));
      const mark = el("mark", null, span.text);
      quote.append(mark);
      quote.append(document.createTextNode(sourceCodepoints.slice(occurrence.end, occurrence.end + 32).join("")));
      evidence.append(quote);
    } else {
      evidence.append(el("p", "shj-entry__muted", "原文块或字符跨度无法在当前冻结数据中解析。"));
    }
    const sourceNav = el("div", "shj-entry__links");
    addSourceLink(sourceNav, occurrence);
    evidence.append(sourceNav);
    root.append(evidence);
    addCategoryEvidence(root, volume, occurrence, globalData);
    container.replaceChildren(root);
    document.title = (span ? span.text : "文本出现") + " · 山海经";
    return () => container.replaceChildren();
  }

  async function mountCandidate(container, context) {
    const { volume, candidate } = context.target;
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const root = el("div", "shj-entry");
    root.dataset.candidateId = candidate.entityCandidateId;
    root.append(el("p", "shj-entry__eyebrow", volumeLabel(volume) + " · 实体候选"));
    const entry = volume.p3.entries.find(row => (candidate.entryRefs || []).includes(row.entryId));
    heading(root, 1, entry ? entry.displayText : candidate.entityCandidateId, "shj-entry__title");
    addStatus(root, "原始候选状态", candidate.identityStatus, IDENTITY_STATUS, "候选，身份状态未提供");
    root.append(el("p", "shj-entry__muted", "实体候选保持独立身份；本页不会因同名或相似词形合并其他候选。"));
    addIdentityEvidence(root, candidate, globalData);
    const referencedEntries = (candidate.entryRefs || []).map(id => volume.p3.entries.find(row => row.entryId === id)).filter(Boolean);
    const section = el("section", "shj-entry__section");
    heading(section, 2, "关联整理条目 " + referencedEntries.length + "/" + (candidate.entryRefs || []).length);
    for (const relatedEntry of referencedEntries) {
      const item = el("article", "shj-entry__card");
      const h = el("h3", "shj-entry__card-title");
      h.append(link({ type: "entry", volumeId: volume.volumeId, id: relatedEntry.entryId }, relatedEntry.displayText || relatedEntry.entryId));
      item.append(h);
      addStatus(item, "条目状态", relatedEntry.status, ENTRY_STATUS, "未提供");
      section.append(item);
    }
    const occurrenceIds = [...new Set(referencedEntries.flatMap(row => row.occurrenceRefs || []))].filter(id => {
      const occurrence = findOccurrence(volume, id);
      return occurrence && occurrence.entityCandidateId === candidate.entityCandidateId;
    });
    heading(section, 2, "关联文本出现 " + occurrenceIds.length);
    for (const id of occurrenceIds) {
      const occurrence = findOccurrence(volume, id);
      appendOccurrenceCard(section, volume, occurrence, globalData, { includeCategories: true });
    }
    if (!occurrenceIds.length) section.append(el("p", "shj-entry__muted", "没有可回指的出现记录。"));
    root.append(section);
    container.replaceChildren(root);
    document.title = (entry ? entry.displayText : "实体候选") + " · 山海经";
    return () => container.replaceChildren();
  }

  function volumeForObjectId(id) {
    return SHJ.bootstrap.volumes.find(row => String(id).startsWith(row.volumeId + "-"));
  }

  async function mountEntity(container, context) {
    const { entity } = context.target;
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const referencedIds = [...new Set([...(entity.candidateIds || []), ...(entity.evidenceOccurrenceIds || [])])];
    const volumeRows = new Map();
    for (let i = 0; i < referencedIds.length; i += 3) {
      if (context.signal.aborted) throw new DOMException("导航已取消", "AbortError");
      const batch = referencedIds.slice(i, i + 3).map(volumeForObjectId).filter(Boolean);
      const unique = [...new Map(batch.map(row => [row.volumeId, row])).values()]
        .filter(row => !volumeRows.has(row.volumeId));
      const loaded = await Promise.all(unique.map(row => context.data.getVolume(row.volumeId, { signal: context.signal })));
      for (const volume of loaded) volumeRows.set(volume.volumeId, volume);
    }
    const candidates = (entity.candidateIds || []).map(id => {
      for (const volume of volumeRows.values()) {
        const candidate = volume.p3.entityCandidates.find(row => row.entityCandidateId === id);
        if (candidate) return { volume, candidate };
      }
      return null;
    }).filter(Boolean);
    const root = el("div", "shj-entry");
    root.append(el("p", "shj-entry__eyebrow", "跨篇身份整理"));
    heading(root, 1, entity.entityId, "shj-entry__title");
    addStatus(root, "整理身份", "canonical", { canonical: "身份整理记录中已确认的整理实体" }, "未提供");
    addStatus(root, "指称层级", entity.referentLevel, REFERENT_LEVEL, "未提供");
    root.append(el("p", "shj-entry__muted", "本页只呈现身份整理记录明确列出的候选成员与证据出现。实体归并依据来自已验收的身份记录；名称相似本身不作为归并依据。"));
    if (entity.reason) root.append(el("p", "shj-entry__reason", entity.reason));
    const identityMeta = el("section", "shj-entry__evidence");
    heading(identityMeta, 2, "归并记录");
    addStatus(identityMeta, "身份任务", (entity.taskIds || []).join("；"), {}, "未提供");
    if (entity.auxiliaryRefs && entity.auxiliaryRefs.length) identityMeta.append(el("p", "shj-entry__muted", "辅助引用：" + entity.auxiliaryRefs.join("；")));
    const canonicalEvidence = el("div", "shj-entry__links");
    for (const id of entity.evidenceOccurrenceIds || []) {
      const volumeRow = volumeForObjectId(id);
      if (volumeRow) canonicalEvidence.append(link({ type: "occurrence", volumeId: volumeRow.volumeId, id }, "身份依据出现 · " + volumeRow.title));
      else canonicalEvidence.append(el("span", "shj-entry__muted", "未绑定篇章的身份引用：" + id));
    }
    if (canonicalEvidence.childNodes.length) identityMeta.append(canonicalEvidence);
    root.append(identityMeta);
    const memberSection = el("section", "shj-entry__section");
    heading(memberSection, 2, "归并记录中的实体候选 " + candidates.length + "/" + (entity.candidateIds || []).length);
    for (const { volume, candidate } of candidates) {
      const item = el("article", "shj-entry__card");
      item.dataset.candidateId = candidate.entityCandidateId;
      const entry = volume.p3.entries.find(row => (candidate.entryRefs || []).includes(row.entryId));
      const h = el("h3", "shj-entry__card-title");
      h.append(link({ type: "candidate", volumeId: volume.volumeId, id: candidate.entityCandidateId }, entry ? entry.displayText : candidate.entityCandidateId));
      item.append(h);
      item.append(el("p", "shj-entry__location", volumeLabel(volume) + " · " + statusText(IDENTITY_STATUS, candidate.identityStatus, "候选身份已记录")));
      memberSection.append(item);
    }
    if (!candidates.length) memberSection.append(el("p", "shj-entry__muted", "引用的候选数据未能从当前按篇包中解析；原 candidate ID 仍保留在下方证据引用中。"));
    root.append(memberSection);
    const evidenceSection = el("section", "shj-entry__section");
    heading(evidenceSection, 2, "身份证据出现 " + (entity.evidenceOccurrenceIds || []).length + " 项");
    let evidenceCount = 0;
    for (const id of entity.evidenceOccurrenceIds || []) {
      const volumeRow = volumeForObjectId(id);
      const volume = volumeRow && volumeRows.get(volumeRow.volumeId);
      const occurrence = volume && findOccurrence(volume, id);
      if (!occurrence) {
        const missing = el("p", "shj-entry__muted", "证据出现引用未能在冻结篇包中解析：" + id);
        evidenceSection.append(missing);
        continue;
      }
      const card = el("article", "shj-entry__card");
      const span = sourceSpan(volume, occurrence);
      card.append(el("h3", "shj-entry__card-title", span ? span.text : occurrence.surface || id));
      card.append(el("p", "shj-entry__location", volumeLabel(volume) + " · 原文块 " + occurrence.blockOrder));
      card.append(link({ type: "occurrence", volumeId: volume.volumeId, id: occurrence.occurrenceId }, "查看文本出现"));
      card.append(link({ type: "reader", volumeId: volume.volumeId, blockKey: [volume.volumeId, occurrence.blockOrder, occurrence.sourceLayer || "original"].join(":") }, "打开读本原文"));
      evidenceSection.append(card);
      evidenceCount += 1;
    }
    if (!evidenceCount && !(entity.evidenceOccurrenceIds || []).length) evidenceSection.append(el("p", "shj-entry__muted", "未提供证据出现引用。"));
    root.append(evidenceSection);
    if (entity.auxiliaryRefs && entity.auxiliaryRefs.length) {
      const auxiliary = el("details", "shj-entry__details");
      auxiliary.append(el("summary", null, "辅助引用 " + entity.auxiliaryRefs.length + " 项"));
      for (const ref of entity.auxiliaryRefs) auxiliary.append(el("p", "shj-entry__muted", ref));
      root.append(auxiliary);
    }
    container.replaceChildren(root);
    document.title = entity.entityId + " · 山海经";
    return () => container.replaceChildren();
  }

  SHJ.registerFeature("entry", mountEntry);
  SHJ.registerFeature("occurrence", mountOccurrence);
  SHJ.registerFeature("candidate", mountCandidate);
  SHJ.registerFeature("entity", mountEntity);
})();
</script>
  <script>(function registerCatalogFeature() {
  "use strict";

  const SHJ = window.SHJ;
  const CANDIDATE_STATUS = {
    unmerged_candidate: "尚未归并的候选",
    unresolved: "身份尚未确定",
    ambiguous: "身份存在歧义",
    pending: "身份待处理"
  };

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function link(target, label) {
    const node = el("a", null, label);
    node.href = SHJ.linkTo(target);
    return node;
  }

  function statusLabel(status) {
    const labels = {
      supported: "分类规则支持",
      candidate: "分类候选",
      unresolved: "分类未定",
      pending: "分类待处理",
      rejected: "分类未接受",
      rule_boundary_flag: "分类边界待核"
    };
    return labels[status] || status || "未提供";
  }

  function findOccurrence(volume, id) {
    return volume.p3.occurrences.find(row => row.occurrenceId === id) || null;
  }

  function entryFor(volume, occurrence) {
    return volume.p3.entries.find(row => row.entryId === occurrence.entryId) || null;
  }

  function volumeLabel(volume) {
    return [volume.title, volume.chapterTitle].filter(Boolean).join(" · ");
  }

  function catalogueName(category) {
    return category.categoryId === "deity.divine" ? "神祇录" : category.label;
  }

  function renderCategoryLinks(parent, categories, selectedId) {
    const nav = el("nav", "shj-catalog__category-nav");
    nav.setAttribute("aria-label", "十二类录册");
    const all = link({ type: "catalog" }, "全部录册");
    if (!selectedId) all.setAttribute("aria-current", "page");
    nav.append(all);
    for (const category of categories) {
      const anchor = link({ type: "catalog", categoryId: category.categoryId }, catalogueName(category));
      anchor.dataset.categoryId = category.categoryId;
      if (category.categoryId === selectedId) anchor.setAttribute("aria-current", "page");
      nav.append(anchor);
    }
    parent.append(nav);
  }

  function renderOccurrence(volume, overlay, occurrence, globalData) {
    const card = el("article", "shj-catalog__item");
    card.dataset.occurrenceId = occurrence.occurrenceId;
    card.dataset.categoryIds = (overlay.categoryIds || []).join(",");
    card.dataset.categoryStatus = overlay.categoryStatus || "";
    const entry = entryFor(volume, occurrence);
    if (entry) card.dataset.entryId = entry.entryId;
    card.dataset.candidateId = occurrence.entityCandidateId || "";
    const title = entry && entry.displayText || occurrence.surface || occurrence.occurrenceId;
    const h = el("h4");
    h.append(link({ type: "occurrence", volumeId: volume.volumeId, id: occurrence.occurrenceId }, title));
    card.append(h);
    card.append(el("p", "shj-catalog__status", statusLabel(overlay.categoryStatus) + " · 出现 " + occurrence.occurrenceId));
    if (overlay.contextQuote) card.append(el("blockquote", "shj-catalog__quote", overlay.contextQuote));
    if (overlay.rationale) card.append(el("p", "shj-catalog__reason", overlay.rationale));
    const links = el("div", "shj-catalog__links");
    if (entry) links.append(link({ type: "entry", volumeId: volume.volumeId, id: entry.entryId }, "整理条目"));
    links.append(link({ type: "candidate", volumeId: volume.volumeId, id: occurrence.entityCandidateId }, "实体候选"));
    links.append(link({
      type: "reader",
      volumeId: volume.volumeId,
      blockKey: [volume.volumeId, occurrence.blockOrder, occurrence.sourceLayer || "original"].join(":")
    }, `读本原文块 ${occurrence.blockOrder}`));
    card.append(links);
    const candidate = volume.p3.entityCandidates.find(row => row.entityCandidateId === occurrence.entityCandidateId);
    if (candidate) card.append(el("p", "shj-catalog__status", "原始候选状态：" + (CANDIDATE_STATUS[candidate.identityStatus] || candidate.identityStatus || "未提供")));
    const canonical = candidate && globalData.identityOverlay.canonicalEntities.find(row => row.candidateIds.includes(candidate.entityCandidateId));
    if (canonical) card.append(link({ type: "entity", id: canonical.entityId }, "已归并整理实体 " + canonical.entityId));
    return card;
  }

  function createLazyVolumeGroup(volumeRef, context, globalData, predicate, emptyText, cleanups) {
    const group = el("details", "shj-catalog__volume");
    group.dataset.volumeId = volumeRef.volumeId;
    group.dataset.loadState = "idle";
    const summary = el("summary");
    summary.dataset.action = "load-volume";
    summary.dataset.volumeId = volumeRef.volumeId;
    summary.append(document.createTextNode(volumeLabel(volumeRef) + " · 按需载入"));
    const contents = el("div", "shj-catalog__volume-content");
    contents.append(el("p", "shj-catalog__empty", "展开后仅读取本篇并回接逐出现分类记录。"));
    group.append(summary, contents);
    let state = "idle";
    const loadGroup = async () => {
      if (state === "loading" || state === "loaded" || context.signal.aborted) return;
      state = "loading";
      group.dataset.loadState = state;
      contents.replaceChildren(el("p", "shj-catalog__empty", "正在读取本篇分类记录…"));
      try {
        const volume = await context.data.getVolume(volumeRef.volumeId, { signal: context.signal });
        if (context.signal.aborted) return;
        const rows = volume.p3.categoryOverlay.filter(predicate);
        const byOccurrence = new Map(rows.map(row => [row.occurrenceId, row]));
        const matches = volume.p3.occurrences.filter(row => byOccurrence.has(row.occurrenceId));
        summary.textContent = volumeLabel(volume) + " · " + matches.length + " 项";
        summary.dataset.itemCount = String(matches.length);
        group.dataset.itemCount = String(matches.length);
        const content = document.createDocumentFragment();
        content.append(link({ type: "reader", volumeId: volume.volumeId }, "打开本篇读本"));
        if (!matches.length) content.append(el("p", "shj-catalog__empty", emptyText));
        for (const occurrence of matches) content.append(renderOccurrence(volume, byOccurrence.get(occurrence.occurrenceId), occurrence, globalData));
        contents.replaceChildren(content);
        state = "loaded";
        group.dataset.loadState = state;
      } catch (error) {
        if (context.signal.aborted) return;
        state = "error";
        group.dataset.loadState = state;
        const message = el("p", "shj-catalog__empty", "本篇读取失败：" + (error && error.message || "未知错误"));
        const retry = el("button", "shj-catalog__retry", "重试读取本篇");
        const onRetry = () => loadGroup();
        retry.addEventListener("click", onRetry);
        cleanups.push(() => retry.removeEventListener("click", onRetry));
        contents.replaceChildren(message, retry);
      }
    };
    const onToggle = () => { if (group.open) loadGroup(); };
    group.addEventListener("toggle", onToggle);
    cleanups.push(() => group.removeEventListener("toggle", onToggle));
    return group;
  }

  async function mountCatalog(container, context) {
    const globalData = await context.data.getGlobal({ signal: context.signal });
    const categories = globalData.taxonomy.categories || [];
    const selectedId = context.target.category ? context.target.category.categoryId : null;
    const selected = selectedId ? categories.find(row => row.categoryId === selectedId) : null;
    const root = el("div", "shj-catalog");
    if (selectedId) root.dataset.categoryId = selectedId;
    root.append(el("p", "shj-catalog__eyebrow", "十二类录册 · 十八篇"));
    const title = el("h1", "shj-catalog__title", selected ? catalogueName(selected) : "分类册");
    root.append(title);
    if (selected && selected.categoryId === "deity.divine") {
      root.append(el("p", "shj-catalog__definition", "分类：" + selected.label));
    }
    renderCategoryLinks(root, categories, selectedId);
    if (selected) {
      if (selected.definition) root.append(el("p", "shj-catalog__definition", selected.definition));
      root.append(el("p", "shj-catalog__policy", "按已有分类判定展示适用出现；候选和未定状态仍保留，不按同名合并。卡片中的身份状态是原始候选状态，正式身份复核见实体候选详情。"));
    } else {
      root.append(el("p", "shj-catalog__policy", "选择类别查看该类在十八篇中的适用条目。目录依据已确认的分类规范；各项按逐出现判定展示。"));
      const summaries = el("div", "shj-catalog__overview");
      for (const category of categories) {
        const card = el("article", "shj-catalog__category");
        const h = el("h2");
        h.append(link({ type: "catalog", categoryId: category.categoryId }, catalogueName(category)));
        card.append(h);
        if (category.definition) card.append(el("p", null, category.definition));
        summaries.append(card);
      }
      root.append(summaries);
      const unresolved = el("details", "shj-catalog__unresolved");
      unresolved.dataset.categoryId = "unresolved";
      const unresolvedSummary = el("summary", null, "尚未确定类别 · 尚未归入十二类");
      unresolvedSummary.dataset.action = "show-unresolved";
      unresolved.append(unresolvedSummary);
      unresolved.append(el("p", "shj-catalog__policy", "此处收录尚未确定类别的逐出现记录，保留其原分类状态、上下文与理由；不替它指定类别。"));
      const unresolvedVolumes = el("div", "shj-catalog__results");
      const cleanupList = [];
      for (const volumeRef of SHJ.bootstrap.volumes) {
        unresolvedVolumes.append(createLazyVolumeGroup(
          volumeRef,
          context,
          globalData,
          row => !(row.categoryIds || []).length,
          "本篇没有尚未确定类别的记录。",
          cleanupList
        ));
      }
      unresolved.append(unresolvedVolumes);
      root.append(unresolved);
      context.onCleanup(() => cleanupList.forEach(cleanup => cleanup()));
    }
    if (selected) {
      const results = el("section", "shj-catalog__results");
      const groupCleanups = [];
      for (const volumeRef of SHJ.bootstrap.volumes) {
        results.append(createLazyVolumeGroup(
          volumeRef,
          context,
          globalData,
          row => (row.categoryIds || []).includes(selected.categoryId),
          "本篇没有已记录的该类别适用出现。",
          groupCleanups
        ));
      }
      root.append(el("p", "shj-catalog__count", "十八篇按篇列出；展开任一篇时才读取该篇并显示逐出现记录。"));
      root.append(results);
      container.replaceChildren(root);
      document.title = catalogueName(selected) + " · 山海经";
      return () => {
        for (const cleanup of groupCleanups) cleanup();
        container.replaceChildren();
      };
    }
    container.replaceChildren(root);
    document.title = (selected ? selected.label : "分类册") + " · 山海经";
    return () => container.replaceChildren();
  }

  SHJ.registerFeature("catalog", mountCatalog);
})();
