ce","locator":"‘南山经之首’招摇段；参考页面附注释义（含璨曰层），不将其当作原文"}],"entityIds":["e-zhaoyao","e-zhu-yu","e-mi-gu","e-xingxing"]},{"id":"p-tangting","order":2,"title":"堂庭之山","chapter":"山經·南山經·鹊山山系","text":"又東三百里，曰堂庭之山，多棪木，多白猿，多水玉，多黃金。","sourceId":"src-classics","locator":"页面标题‘南山經之首’下第二段","translation":{"text":"再向东三百里，称为堂庭山。山上多棪木、多白猿、多水玉，也多黄金。","kind":"AI辅助试译","by":"AI辅助，本样本整理"},"notes":[{"term":"段落范围","text":"此处‘又东三百里’承接前一山，作为独立阅读段落保存。","kind":"本实验整理注","sourceId":null,"locator":null},{"term":"山名异文","text":"独立转录标示‘堂’一作‘常’；主文本作‘堂庭’，本样本沿用主文本。","kind":"来源对读说明","sourceId":"src-wikisource","locator":"‘南山经之首’堂庭段"}],"entityIds":["e-tangting"]},{"id":"p-yuanyi","order":3,"title":"猨翼之山","chapter":"山經·南山經·鹊山山系","text":"又東三百八十里，曰猨翼之山，其中多怪獸，水多怪魚，多白玉，多腹虫，多怪蛇，多怪木，不可以上。","sourceId":"src-classics","locator":"页面标题‘南山經之首’下第三段","translation":{"text":"再向东三百八十里，称为猨翼山。山中多怪兽，水中多怪鱼，还多白玉、腹虫、怪蛇和怪木；人不能登上去。","kind":"AI辅助试译","by":"AI辅助，本样本整理"},"notes":[{"term":"段落范围","text":"本段以山名为中心保存整段概述；‘腹虫’等词义此处不强行现代定名。","kind":"本实验整理注","sourceId":null,"locator":null},{"term":"山名字形","text":"独立转录作‘猿翼’，主文本作‘猨翼’；本样本保留主文本字形。","kind":"来源对读说明","sourceId":"src-wikisource","locator":"‘南山经之首’猿翼段"}],"entityIds":["e-yuanyi"]},{"id":"p-niuyang","order":4,"title":"杻陽之山","chapter":"山經·南山經·鹊山山系","text":"又東三百七十里，曰杻陽之山，其陽多赤金，其陰多白金。有獸焉，其狀如馬而白首，其文如虎而赤尾，其音如謠，其名曰鹿蜀，佩之宜子孫。怪水出焉，而東流注於憲翼之水。其中多玄龜，其狀如龜而鳥首虺尾，其名曰旋龜，其音如判木，佩之不聾，可以為底。","sourceId":"src-classics","locator":"页面标题‘南山經之首’下第四段","translation":{"text":"再向东三百七十里，称为杻阳山。山的南坡多赤金，北坡多白金。有一种兽，形状像马，白色的头，身上的纹理像虎，红色的尾巴，叫声像歌谣，名叫鹿蜀；传说佩带它有利于子孙。怪水发源于此，向东流入宪翼水。水中多玄龟，形状像龟，长着鸟头和蛇尾，名叫旋龟，叫声像劈木声；原文说佩带它可以不耳聋，并说‘可以为底’（此处词义待核）。","kind":"AI辅助试译","by":"AI辅助，本样本整理"},"notes":[{"term":"方位表达","text":"译文暂将山之‘阳/阴’按常见山南/山北理解呈现；这是试译处理，不作为地理考证结论。","kind":"本实验整理注","sourceId":null,"locator":null},{"term":"功效叙述","text":"‘宜子孙’‘不聋’及‘可以为底’均作为古籍叙述翻译；不构成现实功效主张。‘为底’具体含义仍有解释空间。","kind":"本实验整理注","sourceId":null,"locator":null}],"entityIds":["e-niuyang","e-lushu","e-xuangui"]}],"entities":[{"id":"e-zhaoyao","name":"招搖之山","aliases":["招摇之山","招搖山","招摇山"],"category":"山川（实验标签）","tags":["山","鹊山山系"],"summary":"《南山經》鹊山山系记述的首山。","passageIds":["p-zhaoyao"],"features":[{"label":"方位与物产","text":"临于西海之上，多桂，多金玉。","evidence":"臨於西海之上，多桂，多金玉","passageId":"p-zhaoyao"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文记有临西海、多桂、多金玉"],"inference":["具体山体、海岸形态与物产分布的视觉构成需创作推断"],"unknown":["对应现实地理位置未由本样本确认"]}},{"id":"e-tangting","name":"堂庭之山","aliases":["堂庭山","常庭之山"],"category":"山川（实验标签）","tags":["山","鹊山山系"],"summary":"招摇山以东三百里的山。","passageIds":["p-tangting"],"features":[{"label":"记述物产","text":"多棪木，多白猿，多水玉，多黄金。","evidence":"多棪木，多白猿，多水玉，多黃金","passageId":"p-tangting"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文明记棪木、白猿、水玉、黄金"],"inference":["景观和物产的具体外观需创作推断"],"unknown":["棪木与水玉在此段的准确物种或矿物对应未确认"]}},{"id":"e-yuanyi","name":"猨翼之山","aliases":["猿翼之山","猨翼山","猿翼山"],"category":"山川（实验标签）","tags":["山","鹊山山系"],"summary":"堂庭山以东三百八十里的山；原文称其难以登临。","passageIds":["p-yuanyi"],"features":[{"label":"登临描述","text":"不可以上。","evidence":"不可以上","passageId":"p-yuanyi"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文称山中多怪兽、怪蛇、怪木且不可以上"],"inference":["险峻地貌属于视觉构想"],"unknown":["山体形态及各类‘怪’的具体所指未说明"]}},{"id":"e-niuyang","name":"杻陽之山","aliases":["杻阳之山","杻陽山","杻阳山"],"category":"山川（实验标签）","tags":["山","鹊山山系"],"summary":"猨翼山以东三百七十里的山，记有鹿蜀、玄龟及两条水名。","passageIds":["p-niuyang"],"features":[{"label":"山中物产","text":"其陽多赤金，其陰多白金。","evidence":"其陽多赤金，其陰多白金","passageId":"p-niuyang"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文记山阳赤金、山阴白金，并记鹿蜀与旋龟"],"inference":["山体与物产分布的图像化需推断"],"unknown":["对应现实地理位置未由本样本确认"]}},{"id":"e-zhu-yu","name":"祝餘","aliases":["祝余"],"category":"植物（实验标签）","tags":["草","招搖之山"],"summary":"原文所记一种形状如韭、青华的草。","passageIds":["p-zhaoyao"],"features":[{"label":"形态记述","text":"狀如韭而青華","evidence":"其狀如韭而青華","passageId":"p-zhaoyao"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文称形如韭而青华"],"inference":["叶片、花色的具体视觉细节需推断"],"unknown":["现实植物对应未确认"]}},{"id":"e-mi-gu","name":"迷穀","aliases":["迷谷"],"category":"植物（实验标签）","tags":["木","招搖之山"],"summary":"原文所记一种形状如榖、黑理且花光四照的木。","passageIds":["p-zhaoyao"],"features":[{"label":"形态记述","text":"狀如榖而黑理","evidence":"其狀如榖而黑理","passageId":"p-zhaoyao"},{"label":"花的描述","text":"其華四照","evidence":"其華四照","passageId":"p-zhaoyao"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文称形如榖、黑理、花四照"],"inference":["发光效果的具体表现属于创作表达"],"unknown":["榖的具体植物所指及光照机制未说明"]}},{"id":"e-xingxing","name":"狌狌","aliases":["猩猩","狌狌兽"],"category":"异兽（实验标签）","tags":["兽","招搖之山"],"summary":"原文所记白耳、伏行人走的兽。","passageIds":["p-zhaoyao"],"features":[{"label":"外形与行动","text":"其狀如禺而白耳，伏行人走","evidence":"其狀如禺而白耳，伏行人走","passageId":"p-zhaoyao"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文写如禺、白耳、伏行人走"],"inference":["将‘禺’解作类猿的外形参考页面附注；面部、毛色和体态细节需推断"],"unknown":["禺在此处所指及现实动物对应未确认"]}},{"id":"e-lushu","name":"鹿蜀","aliases":["鹿蜀兽"],"category":"异兽（实验标签）","tags":["兽","杻陽之山"],"summary":"原文所记白首、虎纹、赤尾且其声如谣的兽。","passageIds":["p-niuyang"],"features":[{"label":"外形与声音","text":"狀如馬而白首，其文如虎而赤尾，其音如謠","evidence":"其狀如馬而白首，其文如虎而赤尾，其音如謠","passageId":"p-niuyang"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文明确写马形、白首、虎纹、赤尾，声音如谣"],"inference":["体型比例、虎纹分布、色彩明暗与声音表现需创作推断"],"unknown":["原文未说明的解剖细节及现实物种对应"]}},{"id":"e-xuangui","name":"旋龜","aliases":["旋龟","玄龜","玄龟"],"category":"异兽（实验标签）","tags":["龟类异兽","杻陽之山"],"summary":"原文所记形如龟、鸟首虺尾、声如判木的水中异兽。","passageIds":["p-niuyang"],"features":[{"label":"形态","text":"形如龟而鸟首虺尾","evidence":"其狀如龜而鳥首虺尾","passageId":"p-niuyang"},{"label":"声音","text":"声如判木","evidence":"其音如判木","passageId":"p-niuyang"}],"media":{"image":null,"model":null},"visualBrief":{"basis":["原文明确写龟形、鸟首、虺尾，声音如判木"],"inference":["鸟首特征、尾部形态、体色、比例及声音表现需创作推断"],"unknown":["原文未说明的解剖细节与现实动物对应"]}}]};</script>
  <script>(() => {
  "use strict";
  const data = window.SAMPLE_DATA;
  const $ = (s, root=document) => root.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if (!data || !Array.isArray(data.passages) || !Array.isArray(data.entities)) {
    document.body.innerHTML = '<main style="padding:2rem"><h1>读本数据不完整</h1><p>请确认 data/sample.json 符合约定后重新运行 python build.py。</p></main>'; return;
  }
  const meta = data.meta || {}, passages = data.passages, entities = data.entities;
  const byPassage = new Map(passages.map(p => [p.id,p]));
  const byEntity = new Map(entities.map(e => [e.id,e]));
  const sources = new Map((data.sources || []).map(s => [s.id,s]));
  const passageOrder = new Map(passages.map((p, i) => [p.id, Number.isFinite(Number(p.order)) ? Number(p.order) : i]));
  const normalize = s => String(s || "").toLocaleLowerCase("zh-CN").normalize("NFKC").replace(/[\s，。；：、！？“”‘’「」『』（）()【】\[\]·]/g, "");
  const state = {query:"", category:"", sort:"book"};
  let openNotes = new Set();
  const titleText = p => `${p.chapter || ""} ${p.title || ""}`.trim();
  const entityText = e => [e.name,...(e.aliases||[]),e.category,...(e.tags||[]),e.summary,...(e.features||[]).flatMap(f=>[f.label,f.text,f.evidence])].join(" ");
  const passageText = p => [p.title,p.chapter,p.text,p.translation?.text,...(p.notes||[]).flatMap(n=>[n.term,n.text])].join(" ");
  const hasTerm = (hay, q) => !q || normalize(hay).includes(normalize(q));
  const passageMatches = p => hasTerm(passageText(p), state.query) || (p.entityIds||[]).some(id => {const e=byEntity.get(id); return e && hasTerm(entityText(e),state.query);});
  const entityMatches = e => (!state.category || e.category===state.category) && hasTerm(entityText(e),state.query);
  function render() {
    openNotes = new Set([...document.querySelectorAll(".passage")].filter(p=>p.querySelector("details")?.open).map(p=>p.dataset.id));
    const matchingEntities = entities.filter(entityMatches).sort((a,b)=>state.sort==="name" ? a.name.localeCompare(b.name,"zh-CN") : minPassageOrder(a)-minPassageOrder(b));
    const matchedPassages = passages.filter(passageMatches);
    const linkedIds = new Set(matchedPassages.flatMap(p=>p.entityIds||[]));
    const shownEntities = matchingEntities.filter(e => !state.query || linkedIds.has(e.id) || hasTerm(entityText(e),state.query));
    const pNav = $("#passage-list"); pNav.innerHTML = matchedPassages.map(p=>`<li><a href="#passage-${encodeURIComponent(p.id)}">${esc(titleText(p))}</a></li>`).join("");
    const eNav = $("#entity-list"); eNav.innerHTML = shownEntities.map(e=>`<li><a href="#entity-${encodeURIComponent(e.id)}">${esc(e.name)}</a></li>`).join("");
    $("#entity-count").textContent = `（${shownEntities.length}）`;
    $("#result-count").textContent = `显示 ${matchedPassages.length} 段原文 · ${shownEntities.length} 个实体`;
    $("#passages").innerHTML = matchedPassages.map(p=>renderPassage(p,shownEntities)).join("");
    document.querySelectorAll(".passage").forEach(p=>{const details=p.querySelector("details");if(details&&openNotes.has(p.dataset.id))details.open=true;});
    $("#entities").innerHTML = shownEntities.map(renderEntity).join("");
    const empty = matchedPassages.length===0 && shownEntities.length===0;
    $("#empty-state").hidden = !empty;
    $("#passages").hidden = empty;
    $(".entity-section").hidden = empty;
    updateCurrent();
  }
  function minPassageOrder(entity){const orders=(entity.passageIds||[]).map(id=>passageOrder.get(id)).filter(Number.isFinite);return orders.length?Math.min(...orders):Number.MAX_SAFE_INTEGER;}
  function renderPassage(p, shownEntities) {
    const source=sources.get(p.sourceId), related=(p.entityIds||[]).map(id=>byEntity.get(id)).filter(e=>e&&shownEntities.some(se=>se.id===e.id));
    const notes=(p.notes||[]).map(n=>`<li class="note"><strong>${esc(n.term)}</strong> <span class="note-kind">${esc(n.kind||"整理注")}</span>：${esc(n.text)}${noteSource(n)}</li>`).join("");
    return `<article class="passage" id="passage-${esc(p.id)}" data-id="${esc(p.id)}" tabindex="-1"><p class="eyebrow">${esc(p.chapter||"")}</p><h2>${esc(p.title)}</h2><p class="passage-meta">原书序 ${esc(p.order??"—")}${source?` · <a href="#source-${esc(source.id)}">${esc(source.title)}</a>`:""}${p.locator?` · ${esc(p.locator)}`:""}</p><div class="original" lang="zh-Hant">${esc(p.text)}</div>${p.translation?.text?`<div class="translation"><small>试译 · ${esc(p.translation.by||"AI辅助")}</small><div>${esc(p.translation.text)}</div></div>`:""}${notes?`<details><summary>整理注</summary><ul class="note-list">${notes}</ul></details>`:""}${related.length?`<div class="entity-links" aria-label="本段相关实体">${related.map(e=>`<a href="#entity-${encodeURIComponent(e.id)}">${esc(e.name)} ↗</a>`).join("")}</div>`:""}</article>`;
  }
  function noteSource(n){const s=n.sourceId&&sources.get(n.sourceId); return s?` <small>（<a href="#source-${esc(s.id)}">${esc(s.title)}</a>${n.locator?`，${esc(n.locator)}`:""}）</small>`:n.locator?` <small>（${esc(n.locator)}）</small>`:"";}
  function renderEntity(e) {
    const features=(e.features||[]).map(f=>`<li><strong>${esc(f.label)}</strong>：${esc(f.text)}${f.evidence?`<blockquote class="evidence"><small>原文依据 · ${esc(byPassage.get(f.passageId)?.title||"")}</small><br>${esc(f.evidence)}</blockquote>`:""}</li>`).join("");
    const brief=e.visualBrief||{};
    const bullet=(label,items)=>items?.length?`<p><small>${label}</small>：${items.map(esc).join("；")}</p>`:"";
    const refs=(e.passageIds||[]).map(id=>byPassage.get(id)).filter(Boolean);
    return `<article class="entity-card" id="entity-${esc(e.id)}" tabindex="-1"><div><h3>${esc(e.name)}</h3><span class="category">${esc(e.category||"未分类")}</span></div>${e.aliases?.length?`<p class="aliases">检索别名 / 字形：${e.aliases.map(esc).join("、")}</p>`:""}<p class="summary">${esc(e.summary||"")}</p>${e.tags?.length?`<div class="tag-list">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}${features?`<ul class="features">${features}</ul>`:""}<div class="visual-brief"><strong>视觉依据与边界</strong>${bullet("文本所见",brief.basis)}${bullet("整理推断",brief.inference)}${bullet("尚未知",brief.unknown)}</div>${refs.length?`<p class="entity-passages">见于：${refs.map(p=>`<a href="#passage-${encodeURIComponent(p.id)}">${esc(p.title)}</a>`).join("、")}</p>`:""}</article>`;
  }
  function fillStatic(){
    $("#page-title").textContent=meta.title||"山海经"; $("#subtitle").textContent=meta.subtitle||""; $("#scope").textContent=meta.scope||"南山經开篇"; $("#editorial-notice").textContent=meta.editorialNotice||""; document.title=`${meta.title||"山海经"} · 读本`;
    const cats=[...new Set(entities.map(e=>e.category).filter(Boolean))]; $("#category-filter").innerHTML='<option value="">全部实验分类</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
    $("#source-list").innerHTML=(data.sources||[]).map(s=>`<article class="source-item" id="source-${esc(s.id)}" tabindex="-1"><p><strong>${esc(s.title)}</strong> · ${esc(s.kind||"")}${s.accessed?` · 查阅 ${esc(s.accessed)}`:""}</p><p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">打开来源</a> · `:""}${esc(s.note||"")}</p></article>`).join("");
    $("#source-note").textContent=meta.editorialNotice||"原文依来源保留繁体；界面说明采用简体。试译与整理注为辅助内容，请以来源文本为准。";
  }
  function updateCurrent(){const hash=decodeURIComponent(location.hash.slice(1)); document.querySelectorAll(".toc a[aria-current],.entity-nav a[aria-current]").forEach(a=>a.removeAttribute("aria-current")); if(hash.startsWith("passage-"))document.querySelector(`#passage-list a[href="#${CSS.escape(hash)}"]`)?.setAttribute("aria-current","location"); if(hash.startsWith("entity-"))document.querySelector(`#entity-list a[href="#${CSS.escape(hash)}"]`)?.setAttribute("aria-current","location");}
  function goHash(){const hash=decodeURIComponent(location.hash.slice(1));if(!hash)return;let target=document.getElementById(hash);if(!target&&(hash.startsWith("passage-")||hash.startsWith("entity-"))){reset();target=document.getElementById(hash);}if(target){for(let parent=target.parentElement;parent;parent=parent.parentElement)if(parent instanceof HTMLDetailsElement)parent.open=true;requestAnimationFrame(()=>{target.scrollIntoView({block:"start"});target.focus({preventScroll:true});});}}
  function reset(){state.query="";state.category="";state.sort="book";$("#search").value="";$("#category-filter").value="";$("#sort-order").value="book";render();}
  $("#search-form").addEventListener("submit",e=>{e.preventDefault();state.query=$("#search").value;render();});
  $("#search").addEventListener("input",e=>{state.query=e.target.value;render();});
  $("#category-filter").addEventListener("change",e=>{state.category=e.target.value;render();});
  $("#sort-order").addEventListener("change",e=>{state.sort=e.target.value;render();});
  $("#reset-button").addEventListener("click",reset); $("#empty-reset").addEventListener("click",reset);
  window.addEventListener("hashchange",()=>{updateCurrent();goHash();});
  fillStatic();render();goHash();
})();
</script>
  <script>(() => {
  const navigation = document.querySelector('.site-navigation');
  const trigger = document.querySelector('.nav-trigger');
  const menu = document.querySelector('#site-menu');
  let closeTimer;

  function cancelClose() {
    clearTimeout(closeTimer);
  }

  function openMenu() {
    cancelClose();
    menu.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    trigger.setAttribute('aria-label', '关闭站点导航');
  }

  function closeMenu(returnFocus = false) {
    cancelClose();
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-label', '打开站点导航');
    if (returnFocus) trigger.focus();
  }

  if (navigation && trigger && menu) {
    trigger.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse' && matchMedia('(hover: hover)').matches) openMenu();
    });
    navigation.addEventListener('pointerenter', cancelClose);
    navigation.addEventListener('pointerleave', event => {
      if (event.pointerType === 'mouse' && !navigation.contains(document.activeElement)) {
        closeTimer = setTimeout(() => closeMenu(), 180);
      }
    });
    trigger.addEventListener('click', () => {
      if (menu.hidden) openMenu();
      else closeMenu();
    });
    trigger.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        openMenu();
        menu.querySelector('a').focus();
      }
    });
    menu.querySelector('.nav-close').addEventListener('click', () => closeMenu(true));
    menu.addEventListener('click', event => {
      if (event.target.closest('a')) closeMenu();
    });
    navigation.addEventListener('focusout', event => {
      if (event.relatedTarget && !navigation.contains(event.relatedTarget)) closeMenu();
    });
    document.addEventListener('pointerdown', event => {
      if (!menu.hidden && !navigation.contains(event.target)) closeMenu();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !menu.hidden) closeMenu(true);
    });
  }

  const motionToggles = document.querySelectorAll('.motion-toggle');
  motionToggles.forEach(motionToggle => {
    motionToggle.addEventListener('click', () => {
      const paused = document.body.classList.toggle('motion-paused');
      motionToggles.forEach(button => {
        button.setAttribute('aria-pressed', String(paused));
        button.textContent = paused ? '继续动画' : '暂停动画';
      });
    });
  });
})();
</script>
